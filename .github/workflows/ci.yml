name: CI

# 🔴 이 파일은 **저장소 루트**의 .github/ 에 있어야 GitHub 가 읽는다.
#   예전 build-native.yml 은 02.SvelteElectron/.github/ 에 있어 한 번도 안 돌았다
#   (2026-09-11 평가에서 발견). 앱은 02.SvelteElectron/ 아래라 모든 run 이 거기서 돈다.

on:
  push:
    branches: [main, extract-modals]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: 02.SvelteElectron

jobs:
  test:
    name: tsc · vitest · cargo test · check:*
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 02.SvelteElectron/package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            02.SvelteElectron/packages/engine-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('02.SvelteElectron/packages/engine-native/Cargo.lock', '02.SvelteElectron/packages/engine-native/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: npm ci
        run: npm ci

      # Rust → .node 를 만들고 도장을 찍는다. vitest 일부와 check:native 가 이 바이너리를 본다.
      - name: build:native
        run: npm run build:native

      - name: check:native (도장이 지금 소스에서 나왔나)
        run: npm run check:native

      - name: tsc
        run: npx tsc --noEmit

      # pretest 가 gen:manifest 를 먼저 돈다 — 생성물이라 워크트리마다 만들어야 한다
      - name: vitest
        run: npm test

      - name: cargo test
        run: cargo test --release
        working-directory: 02.SvelteElectron/packages/engine-native

      - name: 데이터 위생 검사
        run: |
          npm run check:events
          npm run check:tiers
          npm run check:lanes
          npm run check:rewards
