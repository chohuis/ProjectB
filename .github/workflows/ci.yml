name: CI

# 🔴 이 파일은 **저장소 루트**의 .github/ 에 있어야 GitHub 가 읽는다.
#   예전 build-native.yml 은 02.SvelteElectron/.github/ 에 있어 한 번도 안 돌았다
#   (2026-09-11 평가에서 발견). 앱은 02.SvelteElectron/ 아래라 모든 run 이 거기서 돈다.

on:
  push:
    branches: [main, extract-modals]
    # 문서만 바뀐 push 는 건너뛴다 — 2026-09-12 에 문서 커밋 여섯이 각각 10분짜리 전체 빌드를 돌려 러너가 밀렸다.
    #   ⚠ 코드와 문서를 한 커밋에 섞으면 돈다(paths-ignore 는 「전부 문서일 때만」 건너뛴다).
    paths-ignore:
      - "**/*.md"
      - "02.SvelteElectron/docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "02.SvelteElectron/docs/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: 02.SvelteElectron

jobs:
  test:
    name: tsc · vitest · cargo test · check:*
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 02.SvelteElectron/package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            02.SvelteElectron/packages/engine-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('02.SvelteElectron/packages/engine-native/Cargo.lock', '02.SvelteElectron/packages/engine-native/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: npm ci
        run: npm ci

      # Rust → .node 를 만들고 도장을 찍는다. vitest 일부와 check:native 가 이 바이너리를 본다.
      - name: build:native
        run: npm run build:native

      - name: check:native (도장이 지금 소스에서 나왔나)
        run: npm run check:native

      # 🔴 **tsc 앞이다** (2026-09-11 · 개선 4). 린트는 5초라 빨리 빨간불이 난다.
      #   ⚠ 오류만 막는다 — 경고 94 는 관문이 아니다(`eslint.config.js` 머리말).
      - name: lint
        run: npm run lint

      # ⚠ `.prettierignore` 가 **검사가 글자로 읽는 59 파일**을 빼고 있다.
      #   그 목록이 줄어야 진짜 전량 포맷이다.
      - name: format:check
        run: npm run format:check

      - name: tsc
        run: npx tsc --noEmit

      # pretest 가 gen:manifest 를 먼저 돈다 — 생성물이라 워크트리마다 만들어야 한다
      - name: vitest
        run: npm test

      - name: cargo test
        run: cargo test --release
        working-directory: 02.SvelteElectron/packages/engine-native

      # 🔴 **오늘 처음 돈다** (2026-09-11 · 개선 5). `#![deny(clippy::all)]` 이
      #   `lib.rs` 맨 위에 있었는데 `cargo build` 는 clippy 를 안 봐서 **한 번도
      #   안 돌았다** — CI 가 GitHub 안 읽는 폴더에 있던 것과 같은 모양이다.
      # ⚠ 지금 **113건**이라 `-D warnings` 를 안 붙인다. 0 이 된 뒤에 붙이고
      #   `lib.rs` 의 `warn` 도 `deny` 로 되돌린다. 지금 관문으로 걸면
      #   첫날부터 빨강이라 아무도 안 본다.
      - name: cargo clippy (수를 본다 · 관문 아님)
        run: cargo clippy --release --all-targets
        working-directory: 02.SvelteElectron/packages/engine-native

      - name: 데이터 위생 검사
        run: |
          npm run check:events
          npm run check:tiers
          npm run check:lanes
          npm run check:rewards
