name: Build Native Addon (Windows)

# 🔴 2026-09-11 에 02.SvelteElectron/.github/ 에서 저장소 루트로 옮겼다 — GitHub 는 루트의
#   .github/ 만 읽어서 그 전엔 한 번도 안 돌았다.
# 🔴 옮긴 첫 실행이 빨강이었다(`ac8c8848a`) — 옛 방식대로 packages/engine-native 안에서
#   `npm install` 을 했는데, engine-native 는 **npm 워크스페이스**라 lockfile 이 루트 하나뿐이고
#   `@napi-rs/cli` 도 루트에 풀린다. 본체 CI(ci.yml)가 하는 대로 루트 `npm ci` → `build:native` 로 맞췄다.
#   테스트·검사는 ci.yml 이 돈다. 여기는 엔진이 바뀔 때 .node 를 산출물로 올리는 것만.

on:
  push:
    branches: [main, extract-modals]
    paths:
      - '02.SvelteElectron/packages/engine-native/src/**'
      - '02.SvelteElectron/packages/engine-native/Cargo.toml'
      - '02.SvelteElectron/packages/engine-native/Cargo.lock'
      - '02.SvelteElectron/packages/engine-native/build.rs'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - '02.SvelteElectron/packages/engine-native/src/**'
      - '02.SvelteElectron/packages/engine-native/Cargo.toml'
  workflow_dispatch:

defaults:
  run:
    working-directory: 02.SvelteElectron

jobs:
  build:
    name: Build .node (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 02.SvelteElectron/package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            02.SvelteElectron/packages/engine-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('02.SvelteElectron/packages/engine-native/Cargo.lock', '02.SvelteElectron/packages/engine-native/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # 워크스페이스라 루트에서 한 번. 패키지 폴더 안에서 npm install 하면 lockfile 이 없어 깨진다.
      - name: npm ci
        run: npm ci

      - name: build:native (napi build + 도장)
        run: npm run build:native

      - name: check:native
        run: npm run check:native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-native-win32-x64
          path: |
            02.SvelteElectron/packages/engine-native/engine-native.win32-x64-msvc.node
            02.SvelteElectron/packages/engine-native/.native-stamp.json
          if-no-files-found: error
