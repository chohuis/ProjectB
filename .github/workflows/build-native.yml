name: Build Native Addon (Windows)

# 🔴 2026-09-11 에 02.SvelteElectron/.github/ 에서 저장소 루트로 옮겼다 — GitHub 는 루트의
#   .github/ 만 읽어서 그 전엔 한 번도 안 돌았다. 경로도 루트 기준으로 고쳤다.
#   테스트·검사는 ci.yml 이 돈다. 여기는 엔진이 바뀔 때 .node 를 산출물로 올리는 것만.

on:
  push:
    branches: [main, extract-modals]
    paths:
      - '02.SvelteElectron/packages/engine-native/src/**'
      - '02.SvelteElectron/packages/engine-native/Cargo.toml'
      - '02.SvelteElectron/packages/engine-native/Cargo.lock'
      - '02.SvelteElectron/packages/engine-native/build.rs'
  pull_request:
    paths:
      - '02.SvelteElectron/packages/engine-native/src/**'
      - '02.SvelteElectron/packages/engine-native/Cargo.toml'
  workflow_dispatch:

jobs:
  build:
    name: Build .node (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 02.SvelteElectron/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            02.SvelteElectron/packages/engine-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('02.SvelteElectron/packages/engine-native/Cargo.lock', '02.SvelteElectron/packages/engine-native/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install engine-native deps
        run: npm install
        working-directory: 02.SvelteElectron/packages/engine-native

      - name: Build .node binary
        run: npm run build
        working-directory: 02.SvelteElectron/packages/engine-native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-native-win32-x64
          path: 02.SvelteElectron/packages/engine-native/engine-native.win32-x64-msvc.node
          if-no-files-found: error
