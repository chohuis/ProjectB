name: e2e (3 seasons)

# 별 job — 주 1회(㉤ 사용자 확정 2026-09-27 · PLAN_103 Ⅲ). 3시즌(156주) 자동 진행이
# 실측 약 25~31분(D 2026-09-27 · 패키지 빌드 · 6개 구간 실측 합산 — 재시작 포함)
# 걸려 매 push 에 넣기엔 아깝다. ci.yml 은 안 건드린다.
#
# `scripts/e2e-3seasons.txt` → `scripts/e2e-3seasons.mjs` (DRIVE_USER_DATA 를
# 고정 폴더로 만들어 대본 안의 quit→launch 재시작이 같은 세이브를 보게 한다) →
# `scripts/drive.mjs` 가 패키지 실행파일(`release/win-unpacked/OnePitch.exe`)을
# Playwright 로 조작한다.
#
# ⚠ **러너에서 되는지는 이 워크플로가 처음 돈 결과로 확인한다.** windows-latest
#   러너가 GUI 창을 실제로 그리는지(Xvfb 가 필요 없는 Windows 라 이론상 되지만,
#   GPU 가속이 없는 러너에서 렌더링이 막히면 여기서 처음 드러난다) · 로컬(D 의
#   PC)에서는 됐다 — `smoke:dist`/`e2e:3seasons` 둘 다 로컬 실측 초록.

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 03:00 KST(UTC+9) — 평일 빌드와 안 겹치게
  workflow_dispatch:

defaults:
  run:
    working-directory: 02.SvelteElectron

jobs:
  e2e:
    name: 새 게임 → 3시즌 → 재시작 → 이어하기
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: 02.SvelteElectron/package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            02.SvelteElectron/packages/engine-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('02.SvelteElectron/packages/engine-native/Cargo.lock', '02.SvelteElectron/packages/engine-native/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: npm ci
        run: npm ci

      # build:native (도장) → pack(build:ui 포함 · electron-builder --dir) —
      # `npm run build:native` 가 없으면 `pack` 안의 `build` 는 되지만 `.node` 가
      # 낡아 `check:native`(headless.boot 이 보는 도장)에 걸린다.
      - name: build:native
        run: npm run build:native

      - name: pack (release/win-unpacked)
        run: npm run pack

      - name: e2e:3seasons
        run: npm run e2e:3seasons

      # 실패해도 스크린샷은 남긴다 — 어디서 막혔는지 그림으로 본다
      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: 02.SvelteElectron/resource/logs/shots/**
          if-no-files-found: ignore
          retention-days: 14
